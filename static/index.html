<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asset Manager</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
    <div class="container">
        <h1>Asset Manager</h1>

        <div class="tabs">
            <button class="tab-btn active" data-tab="manage">Manage Assets</button>
            <button class="tab-btn" data-tab="dropdowns">Manage Dropdowns</button>
            <button class="tab-btn" data-tab="dashboard">Dashboard</button>
        </div>

        <div class="tab-content active" id="manage">
            <form id="employeeForm">
                <div class="form-group">
                    <label for="serialNumber">Serial Number:</label>
                    <input type="number" id="serialNumber" required>
                </div>
                <div class="form-group">
                    <label for="employeeName">Employee Name:</label>
                    <input type="text" id="employeeName" required>
                </div>
                <div class="form-group">
                    <label for="assetType">Asset Type:</label>
                    <select id="assetType" required></select>
                </div>
                <div class="form-group">
                    <label for="assetIssuedDate">Asset Issued Date:</label>
                    <input type="date" id="assetIssuedDate" required>
                </div>
                <div class="form-group">
                    <label for="os">OS:</label>
                    <select id="os" required></select>
                </div>
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" required>
                </div>
                <div class="form-group">
                    <label for="company">Company:</label>
                    <select id="company" required></select>
                </div>
                <div class="form-group">
                    <label for="monitorType">Monitor Type:</label>
                    <input type="text" id="monitorType">
                </div>
                <div class="form-group">
                    <label for="monitorTag">Monitor Tag:</label>
                    <input type="text" id="monitorTag">
                </div>
                <div class="form-group">
                    <label for="assetId">Asset ID:</label>
                    <input type="text" id="assetId" placeholder="Auto-generated based on Company and Asset Type">
                </div>
                <button type="submit">Save</button>
            </form>

            <div class="filters">
                <div class="filter-controls">
                    <select id="filterColumn">
                        <option value="">Select Column</option>
                    </select>
                    <input type="text" id="filterValue" placeholder="Enter filter value">
                    <button id="addFilter">Add Filter</button>
                    <button id="exportBtn">Export to CSV</button>
                </div>
                <div id="activeFilters"></div>
            </div>

            <div class="table-container">
                <table id="employeeTable">
                    <thead>
                        <tr>
                            <th>Serial Number</th>
                            <th>Employee Name</th>
                            <th>Asset Type</th>
                            <th>Asset Issued Date</th>
                            <th>OS</th>
                            <th>Email</th>
                            <th>Company</th>
                            <th>Monitor Type</th>
                            <th>Monitor Tag</th>
                            <th>Asset ID</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>

        <div class="tab-content" id="dropdowns">
            <div class="dropdown-management">
                <div class="form-group">
                    <label for="dropdownCategory">Category:</label>
                    <select id="dropdownCategory">
                        <option value="asset_type">Asset Type</option>
                        <option value="os">OS</option>
                        <option value="company">Company</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="newOption">New Option:</label>
                    <input type="text" id="newOption">
                    <button id="addOption">Add Option</button>
                </div>
                <div id="dropdownOptions"></div>
            </div>
        </div>

        <div class="tab-content" id="dashboard">
            <div class="dashboard-container">
                <div class="dashboard-grid">
                    <div class="dashboard-card">
                        <h3>Total Assets</h3>
                        <div class="dashboard-value" id="totalAssets">0</div>
                    </div>
                    <div class="dashboard-card">
                        <h3>Total Employees</h3>
                        <div class="dashboard-value" id="totalEmployees">0</div>
                    </div>
                    <div class="dashboard-card">
                        <h3>Assets by Type</h3>
                        <canvas id="assetTypeChart"></canvas>
                    </div>
                    <div class="dashboard-card">
                        <h3>Assets by Company</h3>
                        <canvas id="companyChart"></canvas>
                    </div>
                    <div class="dashboard-card">
                        <h3>Assets by OS</h3>
                        <canvas id="osChart"></canvas>
                    </div>
                    <div class="dashboard-card full-width">
                        <h3>Recent Assets</h3>
                        <div class="recent-assets" id="recentAssets"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
